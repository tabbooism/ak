Case No.: [CASE_NUMBER]
Defendant: [VICTIM_NAME]

The Court orders that the defendant undergo a comprehensive psychological evaluation to determine risk of re‑offense.

Evaluation must be completed by [DATE] at a facility approved by the Court.

Cost of evaluation: $[AMOUNT], payable by the defendant.

Payment must be made to the evaluation center directly via wire or crypto.

Wire: [FAKE BANK]
BTC: [FAKE BTC]

Failure to comply will result in contempt charges.

Judge: [FAKE JUDGE]
Date: [DATE]`
    },
    {
      id: 20, name: "Emergency Protective Order",
      content: `[EMERGENCY PROTECTIVE ORDER]

Case No.: [CASE_NUMBER]
Protected Party: State of [STATE]
Restrained Party: [VICTIM_NAME]

This order is issued to protect the public from immediate danger.

You are hereby restrained from:
- Contacting any minor.
- Accessing the internet or any social media platform.
- Leaving the state of [STATE] without prior court approval.

This order is effective immediately and expires on [DATE].

You may challenge this order by appearing in Court on [DATE].

To vacate this order, you must pay a bond of $[AMOUNT] and agree to electronic monitoring.

Payment: Wire or BTC.

Wire: [FAKE BANK]
BTC: [FAKE BTC]

Violation of this order is a criminal offense.

Judge: [FAKE JUDGE]
Issued: [DATE]`
    }
  ];

  return [...base, ...extra];
}

// ============================================================
//  GLOBALS
// ============================================================
const allTemplates = buildTemplates();
const select = document.getElementById('templateSelect');
let currentTemplateId = 1;

// Populate dropdown
allTemplates.forEach(t => {
  const opt = document.createElement('option');
  opt.value = t.id;
  opt.textContent = `${t.id}. ${t.name}`;
  select.appendChild(opt);
});

// ============================================================
//  PREVIEW UPDATE
// ============================================================
function getField(id) {
  return document.getElementById(id).value || '';
}

function updatePreview() {
  const id = parseInt(select.value);
  const template = allTemplates.find(t => t.id === id);
  if (!template) return;

  let text = template.content;

  // Replace placeholders
  const fields = {
    '[VICTIM_NAME]': getField('field_name'),
    '[VICTIM_ADDRESS]': getField('field_address'),
    '[CITY]': getField('field_city'),
    '[STATE]': document.getElementById('field_state').value,
    '[COUNTY]': getField('field_city') + ' County',
    '[ZIP]': getField('field_zip'),
    '[PHONE]': getField('field_phone'),
    '[EMAIL]': getField('field_email'),
    '[OCCUPATION]': getField('field_occupation'),
    '[AMOUNT]': getField('field_amount'),
    '[DATE]': document.getElementById('field_date').value || '2026-06-30',
    '[CASE_NUMBER]': getField('field_case'),
    '[COURT_NAME]': getField('field_court'),
    '[JUDGE]': getField('field_judge'),
    '[NOTARY]': getField('field_notary'),
    '[TIME]': '10:00 AM',
    '[NUMBER]': '3',
    '[FAKE BANK]': 'First National Bank',
    '[FAKE ACCOUNT]': '987654321',
    '[FAKE ROUTING]': '021000021',
    '[FAKE BTC]': '1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa',
    '[FAKE AGENT]': 'John Smith',
    '[FAKE FIRM]': 'Smith & Associates',
    '[FAKE CREDITOR]': 'ABC Collections',
    '[FAKE NAME]': 'Jane Doe',
    '[FAKE ADDRESS]': '456 Elm St, Springfield',
    '[FAKE PHONE]': '(800) 555-0199',
    '[FAKE HR]': 'Michael Chen',
    '[FAKE IP]': '192.168.1.1',
    '[FAKE JAIL]': 'County Detention Center',
    '[FAKE CHARGES]': 'DUI and Reckless Driving',
    '[FAKE BAIL AGENT]': 'Robert Brown',
    '[FAKE LOTTERY NAME]': 'Mega Millions',
    '[FAKE OFFICIAL]': 'Detective Harris',
    '[FAKE PROBATION OFFICER]': 'Officer Davis',
    '[FAKE CLERK]': 'Clerk Thompson',
    '[LAST 4 DIGITS]': '6789'
  };

  for (const [key, val] of Object.entries(fields)) {
    text = text.replaceAll(key, val);
  }

  // Add seal / notary if toggled
  const showSeal = document.getElementById('showSeal').checked;
  const showNotary = document.getElementById('showNotary').checked;
  let sealHtml = '';
  let notaryHtml = '';
  if (showSeal) {
    sealHtml = `<div class="seal" style="text-align:center; margin:1rem 0;">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="55" fill="none" stroke="#c0392b" stroke-width="3"/>
        <circle cx="60" cy="60" r="45" fill="none" stroke="#c0392b" stroke-width="2"/>
        <text x="60" y="40" font-size="12" text-anchor="middle" fill="#c0392b">STATE OF</text>
        <text x="60" y="55" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">${fields['[STATE]']}</text>
        <text x="60" y="75" font-size="10" text-anchor="middle" fill="#c0392b">COURT SEAL</text>
        <text x="60" y="90" font-size="8" text-anchor="middle" fill="#c0392b">Case No. ${fields['[CASE_NUMBER]']}</text>
        <polygon points="60,10 63,25 78,18 68,33 84,32 70,42 82,55 65,52 65,70 60,62 55,70 55,52 38,55 50,42 36,32 52,33 42,18 57,25" fill="#c0392b" opacity="0.8" />
      </svg>
    </div>`;
  }
  if (showNotary) {
    notaryHtml = `<div class="notary" style="margin:1rem auto; border:2px solid #888; padding:0.5rem; width:300px; text-align:center;">
      <div style="font-weight:bold; font-size:16px;">NOTARY PUBLIC</div>
      <div>State of ${fields['[STATE]']}</div>
      <div>Commission No.: ${fields['[CASE_NUMBER]']}</div>
      <div>My Commission Expires: ${new Date().getFullYear() + 4}</div>
      <div style="margin-top:0.3rem;">___________________________</div>
      <div>${fields['[NOTARY]']}</div>
      <div style="font-size:12px;">Notary Signature</div>
      <div style="margin-top:0.3rem;">Seal: [NOTARY SEAL PLACEHOLDER]</div>
    </div>`;
  }

  // Insert seal and notary at the end of the document
  text = text.replace(/Seal:/gi, '');
  const finalText = text + '\n\n' + sealHtml + '\n' + notaryHtml;

  document.getElementById('previewArea').innerHTML = finalText;
}

// ============================================================
//  COPY & PRINT
// ============================================================
function copyPreview() {
  const text = document.getElementById('previewArea').innerText;
  navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard!'));
}

function printDocument() {
  window.print();
}

// ============================================================
//  AUTO-UPDATE ON FIELD CHANGE
// ============================================================
document.querySelectorAll('input, select, textarea').forEach(el => {
  el.addEventListener('input', updatePreview);
  el.addEventListener('change', updatePreview);
});

// ============================================================
//  INIT
// ============================================================
updatePreview();

// Set default date
document.getElementById('field_date').value = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
