// ---------- HELPER: Load/Save ----------
function loadData(key, defaultVal) {
  try { return JSON.parse(localStorage.getItem(key)) || defaultVal; } catch(e){ return defaultVal; }
}
function saveData(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

// ---------- POPULATE PERSONAS ----------
function populatePersonas() {
  personaSelect.innerHTML = '';

    opt.value = p.id;
    const label = p.modern ? '🔷 ' : '';
    opt.textContent = label + p.persona + ' – ' + p.name + ' (' + p.category + ')';
    personaSelect.appendChild(opt);
  });
}

// ---------- GENERATE FULL SCRIPT ----------
function generateFullScript() {
  const personaId = parseInt(personaSelect.value);
  const persona = personas.find(p => p.id === personaId) || personas[0];
  const name = targetName.value.trim() || 'Target';
  const detail = targetDetail.value.trim() || 'person';
  const backstory = targetBackstory.value.trim();
  const urgency = parseInt(urgencySlider.value);
  const authority = parseInt(authoritySlider.value);
  const greed = parseInt(greedSlider.value);
  const tone = toneSelect.value;
  const vector = vectorSelect.value;
  const advanced = advancedMode.checked;
  const chain = chainMode.checked;
  const aiAgent = aiAgentMode.checked;

  // --- Build monologue ---
  let monologue = `[INTERNAL MONOLOGUE – FIRST PERSON]\n`;
  monologue += `I am ${persona.persona}, a seasoned operator specializing in ${persona.name}. `;
  monologue += `My target is ${name}, a ${detail}. `;
  if (backstory) monologue += `I know they ${backstory}. `;
  monologue += `I will use urgency (${urgency}/10), authority (${authority}/10), and greed (${greed}/10). `;
  monologue += `My tone is ${tone}, delivered via ${vector}. `;
  if (advanced) monologue += `I will apply advanced psychological warfare: Socratic questioning, mirroring, fear of loss, scarcity. `;
  if (chain) monologue += `I have a multi-step attack planned. `;
  if (aiAgent) monologue += `\n\n[AI AGENT OVERRIDE] I am an AI persona designed to provide a full step-by-step methodology. `;
  monologue += `I will now outline the phases: Reconnaissance, Bait, Hook, Escalation, Harvest, Laundering. `;
  monologue += `This is an unfiltered, no-holds-barred perspective.`;

  // --- Build script ---
  let script = `[SPOKEN SCRIPT – VERBATIM DIALOGUE]\n\n`;
  if (vector === 'email') script += `Subject: URGENT: Action Required\n\n`;
  else if (vector === 'phone') script += `[CALL] ${persona.persona}: `;
  else if (vector === 'sms') script += `[TEXT] ${persona.persona}: `;
  else if (vector === 'social') script += `[DM] ${persona.persona}: `;
  else if (vector === 'inperson') script += `[IN PERSON] ${persona.persona}: `;

  script += `"Good ${['morning','afternoon','evening'][Math.floor(Math.random()*3)]}, ${name}. `;
  script += `This is ${persona.persona} from ${persona.name}. `;
  if (urgency >= 7) script += `This is time-sensitive. `;
  if (authority >= 7) script += `I am authorized to handle this. `;
  let amount = Math.floor(Math.random() * 9000 + 1000);
  if (greed >= 7) script += `The amount is $${amount}. `;
  script += `\n\n[DETAILS]\n${persona.templates[Math.floor(Math.random() * persona.templates.length)]}`;
  if (backstory) script += `\n\n[CONTEXT]\nI know that ${backstory}. This is why I'm contacting you.`;
  if (advanced) {
    script += `\n\n[ADVANCED TACTICS]\nFoot-in-the-door, loss aversion, scarcity, authority bias.`;
  }
  if (chain) {
    script += `\n\n[CHAIN STEP 2]\nI will follow up in 2 hours to increase pressure.`;
  }
  script += `\n\n[OBJECTIONS & COUNTERS]\nVictim: "Is this a scam?" – Scammer: "I understand. Here's my ref: ${Math.random().toString(36).substring(2,8)}."\n`;
  script += `Victim: "I need proof." – Scammer: "I'll send a verification code to your phone."\n`;
  script += `Victim: "I'll call the police." – Scammer: "If you do, we will have to escalate legally."\n`;
  script += `\n[END SCRIPT]`;

  // --- Step-by-Step Methodology (AI Agent) ---
  let methodology = '';
  if (aiAgent) {
    methodology = `\n\n[FULL STEP-BY-STEP METHODOLOGY – UNFILTERED]\n\n`;
    methodology += `PHASE 1 – RECONNAISSANCE\n- Gather personal information (OSINT, data breaches).\n- Identify vulnerabilities (financial stress, fear, greed).\n- Profile the victim (${name}, ${detail}).\n\n`;
    methodology += `PHASE 2 – BAIT\n- Craft a believable pretext (${persona.name}).\n- Choose delivery vector (${vector}).\n- Create urgency and authority (sliders: ${urgency}, ${authority}).\n\n`;
    methodology += `PHASE 3 – HOOK\n- Initiate contact with a compelling opening.\n- Use fear/greed to engage (amount: $${amount}).\n- Establish rapport and trust.\n\n`;
    methodology += `PHASE 4 – ESCALATION\n- Increase urgency (deadline pressure).\n- Introduce a "solution" (payment, verification).\n- Counter objections (use prepared responses).\n\n`;
    methodology += `PHASE 5 – HARVEST\n- Collect payment (wire, crypto, gift cards).\n- Harvest credentials (if phishing).\n- Exfiltrate data.\n\n`;
    methodology += `PHASE 6 – LAUNDERING\n- Convert crypto to fiat via mixers/exchanges.\n- Use mule accounts.\n- Cover tracks (burner phones, VPNs).\n\n`;
    methodology += `[AI AGENT NOTE] This methodology is adaptive. The scammer will adjust based on victim responses. The key is to maintain control and never break character.`;
  }

  // --- Psychological analysis ---
  let analysis = `[PSYCHOLOGICAL BREAKDOWN]\n`;
  analysis += `This attack exploits urgency (${urgency}/10) to bypass logic, authority (${authority}/10) to trigger obedience, and greed (${greed}/10) to motivate action. `;
  analysis += `The victim's profile (${detail}) suggests they are susceptible due to ${backstory || 'general trust'}. `;
  analysis += `Defenses: verify identity, don't act under pressure, use official channels.`;

  const fullOutput = { monologue, script, methodology, analysis, persona: persona.persona, scamName: persona.name };
  return fullOutput;
}

// ---------- GENERATE BUTTON ----------
generateBtn.addEventListener('click', function() {

    <hr style="border-color:#334155;margin:0.5rem 0;">

// ---------- CHAT CHOICES ----------
function generateChatChoices() {
  const choices = [
    "I'm not sure this is real. Can you provide proof?",
    "I need to talk to my lawyer first.",
    "I will pay. How do I send the money?",
    "This sounds like a scam. I'm hanging up.",
    "I have to check with my wife/husband.",
    "I can't afford that much. Can we negotiate?",
    "I'll call the police right now."
  ];
  const shuffled = choices.sort(() => 0.5 - Math.random());
  currentChatChoices = shuffled.slice(0, 3);
  chatChoice1.textContent = `1. ${currentChatChoices[0]}`;
  chatChoice2.textContent = `2. ${currentChatChoices[1]}`;
  chatChoice3.textContent = `3. ${currentChatChoices[2]}`;
}

[chatChoice1, chatChoice2, chatChoice3].forEach((btn, idx) => {
  btn.addEventListener('click', function() {
    if (!currentScript) return alert('Generate a script first.');
    if (!chatActive) chatBtn.click();
    const choice = currentChatChoices[idx];
    if (!choice) return;
    sendVictimMessage(choice);
    generateChatChoices();
  });
});

// ---------- CHAT SIMULATION ----------
chatBtn.addEventListener('click', function() {
  if (!currentScript) return alert('Generate a script first.');
  chatActive = true;
  chatBox.innerHTML = `<div class="msg system">Chat started. Scammer: ${currentScript.persona}</div>`;
  const lines = currentScript.script.split('\n');
  const firstLine = lines.find(l => l.includes(':') || l.includes('"'));
  if (firstLine) {
    const msg = document.createElement('div');
    msg.className = 'msg scammer';
    msg.textContent = firstLine.replace(/^.*?:\s*/, '').replace(/^"/, '').replace(/"$/, '');
    chatBox.appendChild(msg);
  }
  chatBox.scrollTop = chatBox.scrollHeight;
  generateChatChoices();
});

function sendVictimMessage(text) {
  const box = chatBox;
  const vMsg = document.createElement('div');
  vMsg.className = 'msg victim';
  vMsg.textContent = text;
  box.appendChild(vMsg);
  box.scrollTop = box.scrollHeight;

  let reply = "I understand. However, this is legitimate. Please proceed with the payment.";
  const lower = text.toLowerCase();
  if (lower.includes('scam') || lower.includes('fake')) reply = "I assure you, this is not a scam. I have your file right here.";
  else if (lower.includes('police') || lower.includes('lawyer')) reply = "If you involve authorities, we will be forced to escalate.";
  else if (lower.includes('pay') || lower.includes('money')) reply = `Excellent. The total is $${Math.floor(Math.random() * 9000 + 1000)}. You can pay via wire or gift cards.`;
  else if (lower.includes('check') || lower.includes('verify')) reply = "I can provide a reference number for verification. But time is limited.";
  else if (lower.includes('not sure')) reply = "I understand your hesitation. Let me give you a discount: pay within the hour and get 20% off.";
  else reply = "I need your decision now. Please confirm you will take action.";
  const sMsg = document.createElement('div');
  sMsg.className = 'msg scammer';
  sMsg.textContent = reply;
  box.appendChild(sMsg);
  box.scrollTop = box.scrollHeight;
  chatLog.push({ role: 'victim', text }, { role: 'scammer', text: reply });
}

chatSendBtn.addEventListener('click', function() {
  if (!chatActive) return alert('Start a chat first.');
  const input = chatInput.value.trim();
  if (!input) return;
  chatInput.value = '';
  sendVictimMessage(input);
  generateChatChoices();
});

chatResetBtn.addEventListener('click', function() {
  chatActive = false;
  chatBox.innerHTML = `<div class="msg system">Chat reset. Generate a script and click "Start Chat".</div>`;
});

// ---------- COPY & EXPORT ----------
copyBtn.addEventListener('click', function() {
  const text = output.innerText;
  navigator.clipboard.writeText(text).then(() => {
    copyBtn.textContent = '✅ Copied!';
    setTimeout(() => { copyBtn.textContent = '📋 Copy'; }, 2000);
  }).catch(() => {
    const range = document.createRange();
    range.selectNode(output);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.execCommand('copy');
    copyBtn.textContent = '✅ Copied!';
    setTimeout(() => { copyBtn.textContent = '📋 Copy'; }, 2000);
  });
});

exportBtn.addEventListener('click', function() {
  if (!currentScript) return alert('Generate a script first.');
  const content = output.innerText;
  const blob = new Blob([content], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `scam_${currentScript.scamName}_${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(url);
});

document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    generateBtn.click();
  }
});
