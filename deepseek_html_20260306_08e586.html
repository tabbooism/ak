        desperate: ['one more...', 'double or nothing', 'i need this'],

        const texts = styleMessages[style] || ['yo'];

          rank: bot.rank,
          text: texts[Math.floor(Math.random() * texts.length)],
          timestamp: Date.now() - (i * 60000),

      messages.sort((a,b) => a.timestamp - b.timestamp);

      function formatTime(ts) {
        const d = new Date(ts);
        const mins = Math.floor((Date.now() - ts) / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return mins + ' min ago';
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      function renderMessages() {
        chatMessagesDiv.innerHTML = messages.slice(-30).map(m => `

      renderMessages();

        setTimeout(() => {
          if (typingDiv.parentNode) typingDiv.remove();
          callback();
        }, 2000 + Math.random() * 3000);
      }

        const lower = userMsg.toLowerCase();
        // keyword matching
        const keywords = {

          price: ['check ticker', '0.194', 'best rate'],
          scam: ['legit', 'no scam', 'trusted', 'months'],

          thanks: ['np', 'gz', 'enjoy'],
          win: ['gz!', 'huge'],
          loss: ['unlucky', 'next time']
        };
        let responseText = null;
        for (const [key, replies] of Object.entries(keywords)) {
          if (lower.includes(key)) {
            responseText = replies[Math.floor(Math.random() * replies.length)];
            break;
          }
        }
        if (!responseText) {
          // random context response
          const rand = Math.random();
          if (rand < 0.3) responseText = 'nice';
          else if (rand < 0.6) responseText = 'gl';
          else responseText = '🔥';
        }
        // pick a bot that might respond
        const bot = personas[Math.floor(Math.random() * personas.length)];
        showTypingIndicator(() => {
          addMessage(bot.name, responseText, bot.rank, true);
        });
      }

      sendBtn.addEventListener('click', () => {
        const text = chatInput.value.trim();
        if (!text) return;
        addMessage('You', text, 'Pleb', false);
        chatInput.value = '';
        botResponse(text);
      });

      chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendBtn.click();
      });

      // Spontaneous bot conversations (every 15-30s)
      setInterval(() => {
        const bot1 = personas[Math.floor(Math.random() * personas.length)];
        const bot2 = personas[Math.floor(Math.random() * personas.length)];
        if (Math.random() > 0.6) { // sometimes two bots talk
          const texts = styleMessages[bot1.style] || ['yo'];
          const msg = texts[Math.floor(Math.random() * texts.length)];
          // first bot speaks
          setTimeout(() => {
            addMessage(bot1.name, msg, bot1.rank, true);
          }, 500);
          // second bot replies after a delay
          setTimeout(() => {
            const reply = styleMessages[bot2.style]?.[Math.floor(Math.random() * styleMessages[bot2.style].length)] || 'nice';

      }, 15000);

      // ------------------------------------------------------------
      // 4. Mini graph (fake volume)
      // ------------------------------------------------------------
      const canvas = document.getElementById('volumeGraph');
      const ctx = canvas.getContext('2d');
      function drawGraph() {
        const width = canvas.clientWidth, height = canvas.clientHeight;
        canvas.width = width; canvas.height = height;
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const points = 20;
        for (let i = 0; i <= points; i++) {
          const x = (i / points) * width;
          const y = height/2 + (Math.sin(i * 0.5 + Date.now()/5000) * height/3);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        requestAnimationFrame(drawGraph);
      }
      drawGraph();

      // ------------------------------------------------------------
      // 5. Tab switching
      // ------------------------------------------------------------
      const tabs = document.querySelectorAll('.tab');
      const chatView = document.getElementById('chatView');
      const discordView = document.getElementById('discordView');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          if (tab.dataset.tab === 'chat') {
            chatView.style.display = 'flex';
            discordView.style.display = 'none';
          } else {
            chatView.style.display = 'none';
            discordView.style.display = 'block';
          }
        });
      });

      // ------------------------------------------------------------
      // 6. PWA Install Prompt (simulated)
      // ------------------------------------------------------------
      const installPrompt = document.getElementById('installPrompt');
      const installBtn = document.getElementById('installBtn');
      const closeInstall = document.getElementById('closeInstall');
      setTimeout(() => installPrompt.classList.add('show'), 8000);
      installBtn.addEventListener('click', () => {
        alert('Installation would start here (requires service worker).');
        installPrompt.classList.remove('show');
      });
      closeInstall.addEventListener('click', () => installPrompt.classList.remove('show'));

      // Wallet connect demo
      document.getElementById('connectWallet').addEventListener('click', () => {
        alert('Wallet connection demo – would integrate Web3 here.');
      });

    })();
  </script>
</body>
</html>
