// ---------- STATE ----------
let personas = loadData('personas', SCAM_DATABASE);
let history = loadData('history', []);
let currentScript = null;
let chatLog = [];
let chatActive = false;

// ---------- HELPERS ----------
function $(id) { return document.getElementById(id); }
function loadData(key, defaultVal) {
  try { return JSON.parse(localStorage.getItem(key)) || defaultVal; } catch(e){ return defaultVal; }
}
function saveData(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

// ---------- POPULATE DROPDOWNS ----------
function populateScamTypes() {
  const sel = $('scamType');
  sel.innerHTML = '';
  const cats = [...new Set(personas.map(p => p.category))];
  cats.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
    sel.appendChild(opt);
  });
}
populateScamTypes();

function populatePersonas(filter='all') {
  const sel = $('personaSelect');
  sel.innerHTML = '';
  let list = personas;
  if (filter !== 'all') list = list.filter(p => p.category === filter);
  list.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.persona + ' – ' + p.name;
    sel.appendChild(opt);
  });
}
populatePersonas('all');

$('scamType').addEventListener('change', function() {
  const filter = this.value;
  populatePersonas(filter === 'all' ? 'all' : filter);
});

// ---------- SLIDER LABELS ----------
function updateSliderLabels() {
  $('urgencyVal').textContent = $('urgency').value;
  $('authorityVal').textContent = $('authority').value;
  $('greedVal').textContent = $('greed').value;
}
['urgency','authority','greed'].forEach(id => {
  $(id).addEventListener('input', updateSliderLabels);
});
updateSliderLabels();

// ---------- CORE GENERATOR ----------
function generateFullScript() {
  const personaId = parseInt($('personaSelect').value);
  const persona = personas.find(p => p.id === personaId) || personas[0];
  const targetName = $('targetName').value.trim() || 'Target';
  const targetDetail = $('targetDetail').value.trim() || 'unknown person';
  const urgency = parseInt($('urgency').value);
  const authority = parseInt($('authority').value);
  const greed = parseInt($('greed').value);
  const tone = $('tone').value;
  const vector = $('vector').value;
  const advanced = $('advancedMode').checked;

  // ----- Build first-person narrative -----
  let monologue = `[INTERNAL MONOLOGUE – FIRST PERSON]\n`;
  monologue += `I am ${persona.persona}. I have been profiling ${targetName} for days. `;
  monologue += `They are a ${targetDetail}. My objective: extract a significant sum using ${persona.name}. `;
  monologue += `I will apply urgency (${urgency}/10), authority (${authority}/10), and greed (${greed}/10). `;
  monologue += `My tone is ${tone}. My delivery vector: ${vector}. `;
  if (advanced) monologue += `I am using advanced psychological warfare: Socratic questioning, mirroring, and fear of loss. `;
  monologue += `I know their weaknesses: they fear losing control, they trust authority, they want quick solutions. `;
  monologue += `I will start with a hook, then escalate. Let's begin.`;

  // ----- Script (full dialogue) -----
  let script = `[SPOKEN SCRIPT – VERBATIM DIALOGUE]\n\n`;
  // Opening
  script += `[${vector.toUpperCase()}] ${persona.persona}: "Good ${['morning','afternoon','evening'][Math.floor(Math.random()*3)]}, ${targetName}. `;
  script += `This is ${persona.persona} from ${persona.name} department. `;
  // Urgency
  if (urgency >= 7) script += `This is a time-sensitive matter that requires your immediate attention. `;
  else if (urgency >= 4) script += `We need your cooperation within the next 24 hours. `;
  else script += `I'm reaching out to discuss a routine matter. `;
  // Authority
  if (authority >= 7) script += `I am authorized by [high authority] to handle this case, and I have full discretion. `;
  else if (authority >= 4) script += `I represent a legitimate organization with oversight. `;
  else script += `I'm just a humble advisor. `;
  // Greed
  if (greed >= 7) script += `The total amount involved is $${Math.floor(Math.random() * 9000 + 1000)}. `;
  else if (greed >= 4) script += `We require a small processing fee of $${Math.floor(Math.random() * 500 + 50)}. `;
  else script += `There is no financial implication at this stage. `;

  // Specific scam content
  script += `\n\n[SCENARIO DETAIL]\n`;
  if (persona.name.includes('IRS')) {
    script += `Our records show you have unpaid taxes from 2022. If not settled, a warrant will be issued. `;
    script += `To resolve, you can make a payment via gift cards or wire. `;
  } else if (persona.name.includes('Bank')) {
    script += `We detected suspicious activity on your account. Please verify your credentials to prevent lockout. `;
    script += `Click the link I'll send to confirm your identity. `;
  } else if (persona.name.includes('Tech Support')) {
    script += `Your computer has been infected with a critical virus. I need remote access to remove it. `;
    script += `This will only take a few minutes. `;
  } else if (persona.name.includes('Romance')) {
    script += `I have feelings for you, but I'm in a financial bind. Can you help me with a loan? `;
    script += `I promise to pay you back as soon as I get home. `;
  } else if (persona.name.includes('Lottery')) {
    script += `Congratulations! You've won $5 million. To claim, you need to pay a small processing fee. `;
  } else if (persona.name.includes('Debt')) {
    script += `You owe $4,500 in overdue debts. If you don't pay, we'll garnish your wages. `;
  } else if (persona.name.includes('Grandchild')) {
    script += `Grandma, it's me! I'm in jail in Mexico. I need bail money sent quickly. `;
  } else if (persona.name.includes('Job')) {
    script += `We're offering a remote position with a $120k salary. The training fee is $450, refundable. `;
  } else if (persona.name.includes('CEO')) {
    script += `I need you to transfer $48,750 to a vendor account immediately. This is for a confidential acquisition. `;
  } else if (persona.name.includes('Invoice')) {
    script += `Please update our vendor payment details. The attached invoice is for services rendered. `;
  } else if (persona.name.includes('Crypto')) {
    script += `Invest in our AI trading bot. 200% returns in 72 hours. Limited spots. `;
  } else if (persona.name.includes('Grant')) {
    script += `You've been selected for a government grant. Pay the $200 processing fee to release funds. `;
  } else if (persona.name.includes('Medical')) {
    script += `You have outstanding medical bills. We will send collections if not paid within 24 hours. `;
  } else if (persona.name.includes('Deepfake')) {
    script += `I'm the CEO. I need you to authorize this wire using my voice signature. `;
  } else if (persona.name.includes('Extortion')) {
    script += `We have your personal data. Pay $3,500 in Bitcoin or we leak everything. `;
  } else {
    script += `[Custom scam narrative for ${persona.name}] `;
    script += `We have identified a unique opportunity that aligns with your profile. `;
    script += `Let's discuss the details. `;
  }

  // Advanced psychological elements
  if (advanced) {
    script += `\n\n[ADVANCED PSYCHOLOGICAL TACTICS]\n`;
    script += `I will now use the "foot‑in‑the‑door" technique: get a small commitment first. `;
    script += `Then escalate to the main request. I will use "loss aversion" – emphasize what they will lose if they don't act. `;
    script += `I will mirror their language and pace to build rapport. `;
    script += `I will create a false sense of scarcity: "This offer expires in 2 hours." `;
    script += `I will also use "authority bias" by dropping names of respected institutions. `;
  }

  // Victim objections and responses
  script += `\n\n[VICTIM OBJECTIONS & SCAMMER COUNTERS]\n`;
  script += `Victim: "Is this a scam?"\n`;
  script += `Scammer: "I understand your concern. Here is my reference number: ${Math.random().toString(36).substring(2,8)}. `;
  script += `You can verify with our official helpline (which, of course, is also under my control)."\n`;
  script += `Victim: "I need to think about it."\n`;
  script += `Scammer: "I can't guarantee this offer will be available later. We have limited slots."\n`;
  script += `Victim: "I'll call the police."\n`;
  script += `Scammer: "If you involve law enforcement, we will be forced to escalate. This is a private matter."\n`;

  // Closing
  script += `\n[FINAL ESCALATION]\n`;
  script += `Scammer: "I need your decision within 30 minutes. I'll call back. Have your payment ready."\n`;
  script += `[END OF SCRIPT]`;

  // ----- Psychological Analysis (optional) -----
  let analysis = `[PSYCHOLOGICAL BREAKDOWN]\n`;
  analysis += `This script exploits: urgency (${urgency}/10) to bypass rational thought; authority (${authority}/10) to trigger obedience; `;
  analysis += `and greed (${greed}/10) to target desire. The tone is ${tone}. The vector is ${vector}. `;
  analysis += `The victim is ${targetName}, a ${targetDetail}. Vulnerabilities: trust in authority, fear of loss, desire for quick solutions. `;
  if (advanced) analysis += `Advanced tactics: Socratic questioning, mirroring, scarcity, and authority bias. `;
  analysis += `Defenses: verify identity, don't act under pressure, check official channels.`;

  return { monologue, script, analysis, persona: persona.persona, scamName: persona.name };
}

// ---------- GENERATE BUTTON ----------
$('generateBtn').addEventListener('click', function() {
  const data = generateFullScript();
  currentScript = data;
  // Display
  const output = $('output');
  output.innerHTML = `
    <div style="color:#f59e0b;font-weight:bold;">🎭 SCAM: ${data.scamName}</div>
    <div style="color:#94a3b8;font-size:0.8rem;">Persona: ${data.persona}</div>
    <hr style="border-color:#334155;margin:0.5rem 0;">
    ${data.monologue.replace(/\n/g, '<br>')}
    <hr style="border-color:#334155;margin:0.5rem 0;">
    ${data.script.replace(/\n/g, '<br>')}
    <hr style="border-color:#334155;margin:0.5rem 0;">
    <div style="color:#3b82f6;">${data.analysis.replace(/\n/g, '<br>')}</div>
  `;
  // Save history
  history.push({ ...data, timestamp: new Date().toISOString() });
  if (history.length > 50) history = history.slice(0, 50);
  saveData('history', history);
  // Enable chat
  chatActive = false;
  $('chatBox').innerHTML = `<div class="msg system">Script generated. Click "Start Chat Simulation" to begin.</div>`;
});

// ---------- CHAT SIMULATION ----------
$('chatBtn').addEventListener('click', function() {
  if (!currentScript) return alert('Generate a script first.');
  chatActive = true;
  chatLog = [];
  const box = $('chatBox');
  box.innerHTML = `<div class="msg system">Chat started. You are playing the victim. The scammer is ${currentScript.persona}.</div>`;
  // Initial scammer message (first line of script)
  const firstLine = currentScript.script.split('\n').find(line => line.includes(':'));
  if (firstLine) {
    const msg = document.createElement('div');
    msg.className = 'msg scammer';
    msg.textContent = firstLine.trim();
    box.appendChild(msg);
  }
  box.scrollTop = box.scrollHeight;
});

$('chatSendBtn').addEventListener('click', function() {
  if (!chatActive) return alert('Start a chat first.');
  const input = $('chatInput').value.trim();
  if (!input) return;
  $('chatInput').value = '';
  const box = $('chatBox');
  // Victim message
  const vMsg = document.createElement('div');
  vMsg.className = 'msg victim';
  vMsg.textContent = input;
  box.appendChild(vMsg);
  // Scammer response – use current script context, but we simulate a reply
  let reply = "I understand your concern. However, this is a legitimate matter. Please proceed with the payment.";
  if (input.toLowerCase().includes('scam') || input.toLowerCase().includes('fake')) {
    reply = "I assure you, this is not a scam. I have your file right here. Let's resolve this quickly.";
  } else if (input.toLowerCase().includes('police')) {
    reply = "If you involve police, we will be forced to escalate. I strongly advise against it.";
  } else if (input.toLowerCase().includes('how much')) {
    reply = `The total is $${Math.floor(Math.random() * 9000 + 1000)}. You can pay via wire or gift cards.`;
  } else if (input.toLowerCase().includes('prove')) {
    reply = "I can provide a reference number and a call-back number for verification. But time is limited.";
  } else if (input.toLowerCase().includes('time')) {
    reply = "You have 30 minutes. I will call you back. Have your payment ready.";
  } else {
    reply = "I need your decision now. Please confirm you will take action.";
  }
  const sMsg = document.createElement('div');
  sMsg.className = 'msg scammer';
  sMsg.textContent = reply;
  box.appendChild(sMsg);
  box.scrollTop = box.scrollHeight;
  // Log chat
  chatLog.push({ role: 'victim', text: input });
  chatLog.push({ role: 'scammer', text: reply });
});

$('chatResetBtn').addEventListener('click', function() {
  chatActive = false;
  $('chatBox').innerHTML = `<div class="msg system">Chat reset. Generate a script and click "Start Chat".</div>`;
});

// ---------- ADDITIONAL FEATURE: Quick copy & export ----------
document.addEventListener('keydown', function(e) {
