nt-size:0.85rem;transition:0.2s;display:inline-flex;align-items:center;gap:0.4rem}.btn:hover{background:var(--accent);color:#000}.btn-danger{border-color:var(--accent2);color:var(--accent2)}.btn-danger:hover{background:var(--accent2);color:#fff}.btn-success{border-color:var(--success);color:var(--success)}.btn-success:hover{background:var(--success);color:#000}.input,select,textarea{width:100%;padding:0.7rem;background:#0b0f14;border:1px solid var(--border);border-radius:4px;color:#fff;font-size:0.9rem;margin-bottom:1rem}.input:focus,select:focus{outline:none;border-color:var(--accent)}.progress-bar{height:8px;background:#1f2a36;border-radius:4px;margin:0.5rem 0;overflow:hidden}.progress-fill{height:100%;background:var(--accent);width:0%;transition:width 0.5s}.log{background:#0b0f14;border:1px solid var(--border);border-radius:var(--radius);padding:1rem;max-height:300px;overflow-y:auto;font-family:'Fira Code',monospace;font-size:0.8rem;color:#a0b0c0}.log .entry{margin-bottom:0.5rem;border-bottom:1px solid #1f2a36;padding-bottom:0.5rem}.table{width:100%;border-collapse:collapse;margin:1rem 0}th,td{padding:0.75rem;text-align:left;border-bottom:1px solid var(--border)}th{color:var(--accent);font-size:0.85rem;text-transform:uppercase}.pagination{display:flex;gap:0.5rem;margin-top:1rem;align-items:center}.pagination button{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:0.25rem 0.75rem;border-radius:4px;cursor:pointer}.pagination button:disabled{opacity:0.5;cursor:default}.badge{display:inline-block;padding:0.25rem 0.6rem;border-radius:12px;font-size:0.75rem;font-weight:600;margin:0 0.2rem}.badge-open{background:var(--success);color:#000}.badge-click{background:var(--accent);color:#000}.badge-submit{background:var(--accent2);color:#fff}.accordion{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1rem}.accordion-header{padding:1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center}.accordion-header:hover{background:rgba(0,229,255,0.05)}.accordion-body{padding:1rem;display:none;border-top:1px solid var(--border)}.accordion-body.active{display:block}pre{background:#0b0f14;padding:1rem;border-radius:4px;overflow-x:auto;font-family:'Fira Code',monospace;font-size:0.85rem;white-space:pre-wrap}@media(max-width:768px){.sidebar{width:200px}.main{margin-left:200px;padding:1rem}}

<script>
// ==================== ENGINE ====================
const DB = {
    campaigns: JSON.parse(localStorage.getItem('cb_camps')||'[]'),
    payloads: JSON.parse(localStorage.getItem('cb_payloads')||'[]'),
    sims: JSON.parse(localStorage.getItem('cb_sims')||'[]'),
    events: JSON.parse(localStorage.getItem('cb_events')||'[]'),
    save(){ localStorage.setItem('cb_camps',JSON.stringify(this.campaigns)); localStorage.setItem('cb_payloads',JSON.stringify(this.payloads)); localStorage.setItem('cb_sims',JSON.stringify(this.sims)); localStorage.setItem('cb_events',JSON.stringify(this.events)); }
};
const State = { activeTab:'dashboard', activeSimId:null, charts:{}, scamPage:0, narPage:0, camSimRunning:false };

const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1)+a);
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const ts=()=>new Date().toLocaleTimeString();
const fakeHash=()=>Array.from({length:40},()=>Math.floor(Math.random()*16).toString(16)).join('');
const addEvent=msg=>{ DB.events.unshift({time:ts(),msg}); if(DB.events.length>50)DB.events.length=50; DB.save(); if(State.activeTab==='dashboard')refreshDashboard(); };

function switchTab(t){
    document.querySelectorAll('.sidebar .tab').forEach(x=>x.classList.remove('active'));
    const el=document.querySelector(`.sidebar .tab[data-tab="${t}"]`); if(el)el.classList.add('active');
    State.activeTab=t; loadContent(t);
}
document.querySelectorAll('.sidebar .tab').forEach(t=>{ t.addEventListener('click',()=>switchTab(t.dataset.tab)); });

function loadContent(tab){
    const main=document.getElementById('mainContent');
    switch(tab){
        case 'dashboard': main.innerHTML=renderDashboard(); refreshDashboard(); break;
        case 'killchain': main.innerHTML=renderKillChain(); break;
        case 'phishing': main.innerHTML=renderPhishing(); loadPhishing(); break;
        case 'vishing': main.innerHTML=renderVishing(); initVish(); break;
        case 'payloads': main.innerHTML=renderPayloads(); loadPayloads(); break;
        case 'recon': main.innerHTML=renderRecon(); break;
        case 'mobile': main.innerHTML=renderMobile(); break;
        case 'scams': main.innerHTML=renderScamLib(); break;
        case 'vectors': main.innerHTML=renderVectors(); break;
        case 'narrative': main.innerHTML=renderNarrative(); break;
        case 'voip': main.innerHTML=renderVoip(); initVoip(); break;
        case 'darkweb': main.innerHTML=renderDarkWeb(); break;
        case 'analytics': main.innerHTML=renderAnalytics(); renderAnalyticsCharts(); break;
        case 'training': main.innerHTML=renderTraining(); loadTraining(); break;
        case 'simulation': main.innerHTML=renderSim(); loadActiveSim(); break;
        case 'campaignsim': main.innerHTML=renderCamSim(); break;
        case 'dataex': main.innerHTML=renderDataEx(); break;
        case 'ransom': main.innerHTML=renderRansom(); break;
        case 'export': main.innerHTML=renderExport(); break;
        default: main.innerHTML='<p>Tab not found.</p>';
    }
}

// ==================== DASHBOARD ====================
function renderDashboard(){ return `<h2><i class="fas fa-chart-pie"></i> Live Dashboard</h2><div class="grid" id="dashStats"></div><div style="margin-top:1.5rem"><h3>Event Log</h3><div class="log" id="eventLog"></div></div>`; }
function refreshDashboard(){
    const s=document.getElementById('dashStats'); if(!s)return;
    const active=DB.campaigns.filter(c=>c.status==='active').length;
    const targets=DB.campaigns.reduce((a,c)=>a+(c.targets||0),1200);
    const ev=DB.events.length+rnd(5,30);
    const totalSent=DB.campaigns.reduce((a,c)=>a+c.sent,0);
    const totalConv=DB.campaigns.reduce((a,c)=>a+c.converted,0);
    const rate=totalSent?(totalConv/totalSent*100).toFixed(1):'0.0';
    s.innerHTML=`<div class="card"><div class="stat-val">${active}</div><div class="stat-lab">Active Campaigns</div></div><div class="card"><div class="stat-val">${targets}</div><div class="stat-lab">Targets</div></div><div class="card"><div class="stat-val">${ev}</div><div class="stat-lab">Events Today</div></div><div class="card"><div class="stat-val">${rate}%</div><div class="stat-lab">Conv. Rate</div></div>`;
    const log=document.getElementById('eventLog'); log.innerHTML=DB.events.slice(0,20).map(e=>`<div class="entry"><span style="color:var(--accent)">[${e.time}]</span> ${e.msg}</div>`).join('');
}
setInterval(()=>{ if(State.activeTab==='dashboard') addEvent(pick(['Email opened','Link clicked','Creds submitted','Call answered','Payload executed','Ransomware deployed'])+' by target '+rnd(100,999)); },5000);

// ==================== KILL CHAIN ====================
function renderKillChain(){ return `<h2><i class="fas fa-crosshairs"></i> Kill Chain Generator</h2><div class="card" style="margin-bottom:1.5rem"><h3>Target</h3><input class="input" placeholder="Name" id="kcName" value="John Smith"><input class="input" placeholder="Role" id="kcRole" value="CFO"><input class="input" placeholder="Company" id="kcCompany" value="Acme Corp"><input class="input" placeholder="Email" id="kcEmail" value="john@acme.com"><input class="input" placeholder="Phone" id="kcPhone" value="+1 555 0199"><select class="input" id="kcObj"><option>Credential Theft</option><option>Ransomware</option><option>Data Exfil</option></select><button class="btn" id="genKC"><i class="fas fa-play"></i> Generate</button></div><div id="kcOut"></div>`; }
document.addEventListener('click',e=>{ if(e.target&&e.target.id==='genKC'){
    const t={name:document.getElementById('kcName').value,role:document.getElementById('kcRole').value,company:document.getElementById('kcCompany').value,email:document.getElementById('kcEmail').value,phone:document.getElementById('kcPhone').value};
    const chain=['Recon','Weaponization','Delivery','Exploitation','Installation','C2','Actions'].map((p,i)=>({phase:p,tech:pick(['OSINT','DNS enum','Subdomain scan','Email harvesting','Social profiling']),detail:`Full tactical detail for ${p} phase against ${t.name}: we will ${p==='Recon'?'gather social media and DNS intelligence':p==='Weaponization'?'create a polymorphic payload with <5% detection rate':p==='Delivery'?'use a spear-phishing email with malicious macro':'...'}`}));
    let h='<h3>Kill Chain</h3>'; chain.forEach((s,i)=>{ h+=`<div class="accordion"><div class="accordion-header" onclick="this.parentElement.querySelector('.accordion-body').classList.toggle('active')"><span><strong>Phase ${i+1}: ${s.phase}</strong></span><i class="fas fa-chevron-down"></i></div><div class="accordion-body">${s.detail}</div></div>`; });
    document.getElementById('kcOut').innerHTML=h; addEvent('Kill chain generated for '+t.name);
}});

// ==================== PHISHING ====================
function renderPhishing(){ return `<h2><i class="fas fa-envelope"></i> Phishing Manager</h2><div class="card" style="margin-bottom:1.5rem"><h3>Launch</h3><form id="phForm"><input class="input" placeholder="Name" id="phName" required><select class="input" id="phTpl"><option>Password Reset</option><option>CEO Fraud</option><option>Invoice</option></select><input class="input" type="number" placeholder="Targets" id="phTargets" value="100" min="1"><button class="btn"><i class="fas fa-rocket"></i> Launch</button></form></div><div class="grid" id="phList"></div>`; }
function loadPhishing(){
    document.getElementById('phForm').addEventListener('submit',e=>{ e.preventDefault();
        const n=document.getElementById('phName').value,tpl=document.getElementById('phTpl').value,targets=parseInt(document.getElementById('phTargets').value)||100;
        DB.campaigns.push({id:Date.now(),name:n,type:'phishing',template:tpl,status:'active',sent:targets,opened:0,clicked:0,converted:0,targets}); DB.save(); renderPhishList(); addEvent(`Campaign "${n}" launched.`); document.getElementById('phForm').reset();
    });
    renderPhishList();
}
function renderPhishList(){
    const g=document.getElementById('phList'); g.innerHTML=DB.campaigns.map(c=>`<div class="card"><strong>${c.name}</strong> <span class="badge badge-${c.status==='active'?'open':'click'}">${c.status}</span><p>Sent:${c.sent} Open:${c.opened} Click:${c.clicked} Conv:${c.converted}</p><button class="btn btn-success" onclick="simCamp(${c.id},'open')">Sim Open</button><button class="btn" onclick="simCamp(${c.id},'click')">Sim Click</button><button class="btn btn-danger" onclick="delCamp(${c.id})">Delete</button></div>`).join('');
}
window.simCamp=(id,act)=>{ const c=DB.campaigns.find(x=>x.id===id); if(!c)return; if(act==='open')c.opened=Math.min(c.sent,c.opened+rnd(5,20)); else if(act==='click')c.clicked=Math.min(c.opened,c.clicked+rnd(2,10)); c.converted=Math.floor(c.clicked*0.3); DB.save(); renderPhishList(); addEvent(`Sim ${act} on ${c.name}`); };
window.delCamp=id=>{ DB.campaigns=DB.campaigns.filter(x=>x.id!==id); DB.save(); renderPhishList(); };

// ==================== VISHING ====================
function renderVishing(){ return `<h2><i class="fas fa-phone-alt"></i> Vishing Simulation</h2><div id="vishCont" class="sim-window"></div>`; }
const vSteps={ start:{prompt:"They answer 'Hello?'", choices:[{text:"Authoritative (IT)",next:"verify"},{text:"Friendly (HR)",next:"survey"},{text:"Urgent (CEO)",next:"ceo"}]}, verify:{prompt:"'Who is this?'",choices:[{text:"Fake name",next:"cred"},{text:"Ref ID",next:"cred"}]}, survey:{prompt:"Survey?",choices:[{text:"Remote work",next:"extract"},{text:"Gift card",next:"phish"}]}, ceo:{prompt:"'What for?'",choices:[{text:"Wire transfer",next:"wire"},{text:"Credentials",next:"cred"}]}, cred:{prompt:"Comply?",choices:[{text:"Password",next:"end"},{text:"Link",next:"end"}]}, wire:{prompt:"Details?",choices:[{text:"Give",next:"end"},{text:"Callback",next:"end"}]}, phish:{prompt:"Push?",choices:[{text:"Urgency",next:"end"},{text:"Back off",next:"end"}]}, extract:{prompt:"Continue?",choices:[{text:"Creds",next:"cred"},{text:"End",next:"end"}]}, end:{prompt:"Simulation complete.",choices:[]} };
function initVish(){ State.vishStep='start'; renderVishStep(); }
function renderVishStep(){
    const s=vSteps[State.vishStep]; const c=document.getElementById('vishCont'); if(!c)return;
    c.innerHTML=`<p style="font-size:1.1rem">${s.prompt}</p>`;
    if(s.choices.length){ const d=document.createElement('div'); d.className='sim-choices'; s.choices.forEach(ch=>{ const b=document.createElement('button'); b.className='choice-btn'; b.textContent=ch.text; b.onclick=()=>{ State.vishStep=ch.next; if(State.vishStep==='end')c.innerHTML+='<p class="highlight">Ended.</p><button class="btn" onclick="initVish()">Restart</button>'; else renderVishStep(); }; d.appendChild(b); }); c.appendChild(d); }
    else c.innerHTML+='<button class="btn" onclick="initVish()">Restart</button>';
}

// ==================== PAYLOADS ====================
function renderPayloads(){ return `<h2><i class="fas fa-biohazard"></i> Polymorphic Payloads</h2><div class="card" style="margin-bottom:1.5rem"><h3>Generate</h3><input class="input" id="plName" value="loader.exe"><select class="input" id="plType"><option>exe</option><option>dll</option><option>doc</option></select><select class="input" id="plObf"><option>low</option><option>medium</option><option>high</option></select><label><input type="checkbox" id="plPoly" checked> Polymorphic</label><button class="btn" id="genPl"><i class="fas fa-cog"></i> Generate</button></div><div id="plOut"></div>`; }
function loadPayloads(){
    document.getElementById('genPl').onclick=()=>{
        const name=document.getElementById('plName').value,type=document.getElementById('plType').value,obf=document.getElementById('plObf').value,poly=document.getElementById('plPoly').checked;
        const vars=poly?7:1; const list=[]; for(let i=0;i<vars;i++){ const det=obf==='low'?0.7+Math.random()*0.2:obf==='medium'?0.3+Math.random()*0.4:Math.random()*0.25; list.push({id:Date.now()+i,name:name.replace('.',`_v${i}.`),type,obf,det,hash:fakeHash(),size:rnd(50000,2000000)}); }
        DB.payloads.push(...list); DB.save();
        let h='<h4>Generated</h4><table class="table"><tr><th>Name</th><th>Hash</th><th>Detection</th><th>Size</th></tr>'; list.forEach(p=>h+=`<tr><td>${p.name}</td><td style="font-family:monospace">${p.hash}</td><td style="color:${p.det>0.5?'var(--accent2)':'var(--success)'}">${(p.det*100).toFixed(1)}%</td><td>${(p.size/1024).toFixed(0)}KB</td></tr>`); h+='</table>';
        if(window.polyChart)window.polyChart.destroy(); h+='<canvas id="polyChart" height="100"></canvas>'; document.getElementById('plOut').innerHTML=h;
        new Chart(document.getElementById('polyChart'),{type:'bar',data:{labels:list.map(p=>p.name),datasets:[{label:'Detection %',data:list.map(p=>p.det*100),backgroundColor:list.map(p=>p.det>0.5?'#ff0055':'#00e676')}]}});
        addEvent(`Generated ${vars} payloads.`);
    };
}

// ==================== RECON ====================
function renderRecon(){ return `<h2><i class="fas fa-search"></i> Recon Drone</h2><div class="card" style="max-width:600px"><input class="input" id="recDom" value="megacorp.local"><button class="btn" id="startRec"><i class="fas fa-satellite"></i> Scan</button><div class="progress-bar"><div class="progress-fill" id="recProg" style="width:0%"></div></div><div id="recOut"></div></div>`; }
document.addEventListener('click',e=>{ if(e.target&&e.target.id==='startRec'){ const p=document.getElementById('recProg'); let w=0; const int=setInterval(()=>{ w+=25; p.style.width=w+'%'; if(w>=100){ clearInterval(int); const d=document.getElementById('recDom').value; document.getElementById('recOut').innerHTML=`<h4>Scan Complete</h4><pre>DNS: A 192.168.1.10, MX mail.${d}\nSubdomains: dev.${d}, vpn.${d}\nPorts: 22 open, 80 open, 443 open</pre>`; addEvent(`Recon on ${d} done.`); }},400); }});

// ==================== MOBILE ====================
function renderMobile(){ return `<h2><i class="fas fa-mobile-alt"></i> Mobile Ops</h2><div class="grid"><div class="card"><h3>SMS</h3><input class="input" placeholder="Number" value="+1 555 0192"><textarea class="input" rows="2">Urgent: Verify: https://bit.ly/2FAKE</textarea><button class="btn" onclick="addEvent('SMS sent')">Send</button></div><div class="card"><h3>Call Log</h3><button class="btn" onclick="genCallLog()">Generate</button><div id="callLog"></div></div></div>`; }
window.genCallLog=()=>{ const l=Array.from({length:3},()=>`${pick(['+1 555 1111','+1 555 2222'])} -> +1 555 ${rnd(1000,9999)} | ${pick(['Answered','Voicemail'])}`); document.getElementById('callLog').innerHTML=l.map(x=>`<p>${x}</p>`).join(''); };

// ==================== SCAM LIBRARY 10K ====================
const scamTypes = ['Phishing','Vishing','Smishing','BEC','Romance','Tech Support','IRS','Lottery','Charity','Job Scam'];
const subs = ['Spear Phishing','Whaling','Clone Phishing','Vishing CEO Fraud','Vishing IT Support','Smishing Package','BEC Invoice','Romance Military','Tech Support Popup','IRS Tax Debt','Lottery Winner','Fake Charity','Fake Job Offer'];
const pretextTemplates = ['${service} account compromised.','Urgent wire for ${amount}.','Package fee ${fee}.','Bank details updated.','Need ${amount} to come home.','IRS: owe ${amount}.','You won ${prize}! Send ${fee}.','Donate to ${cause}.','Job offer: pay ${fee} for training.'];
const redFlags = ['Generic greeting','Urgency','Mismatched URL','Unsolicited','Request personal info','Gift card payment','Pressure','Email address off','Unusual request','No confirmation'];

function generateScamVariant(i){
    const type = scamTypes[i % scamTypes.length];
    const sub = subs[i % subs.length];
    const pretext = pretextTemplates[i % pretextTemplates.length].replace('${service}',pick(['email','bank'])).replace('${amount}',rnd(100,5000)).replace('${fee}',rnd(5,50)).replace('${prize}',rnd(10000,1000000)).replace('${cause}',pick(['children','veterans']));
    const rf = pick(redFlags)+', '+pick(redFlags);
    return { type, sub, pretext, redflags: rf };
}

let generatedScamVariants = [];
function renderScamLib(){ return `<h2><i class="fas fa-book"></i> Scam Library (10K)</h2><div class="card"><button class="btn" id="gen10k">Generate 10,000 Variants</button> <button class="btn" id="exportScamCSV"><i class="fas fa-download"></i> Export CSV</button></div><div id="scamTableCont"><p>Click generate.</p></div>`; }
function renderScamPage(page, perPage=50){
    const start = page*perPage, chunk = generatedScamVariants.slice(start,start+perPage);
    const total = Math.ceil(generatedScamVariants.length/perPage);
    let h = `<table class="table"><tr><th>#</th><th>Type</th><th>Subtype</th><th>Pretext</th><th>Red Flags</th></tr>`;
    chunk.forEach((v,i)=>h+=`<tr><td>${start+i+1}</td><td>${v.type}</td><td>${v.sub}</td><td>${v.pretext}</td><td>${v.redflags}</td></tr>`);
    h+=`</table><div class="pagination"><button ${page===0?'disabled':''} onclick="changeScamPage(${page-1})">Prev</button><span>Page ${page+1} of ${total}</span><button ${page>=total-1?'disabled':''} onclick="changeScamPage(${page+1})">Next</button></div>`;

}
window.simAct=act=>{ const sim=DB.sims.find(s=>s.id===State.activeSimId); if(!sim)return; const pts={correct:20,neutral:5,wrong:-10}; sim.score+=pts[act]; sim.step++; if(sim.step>=3)sim.status='completed'; DB.save(); loadActiveSim(); };
