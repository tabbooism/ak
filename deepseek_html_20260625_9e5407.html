    },
    grandparent: {
        basic: (t,a,c) => `Grandma, it's me. I'm in trouble. Send $${a} to my friend. Context: ${c}.`,
        detailed: (t,a,c) => `Grandma, this is your grandson. I've been arrested and need bail money. Please send $${a} to my lawyer. Don't tell Mom and Dad. Context: ${c}.`,
        full: (t,a,c) => `Grandma, please don't panic. I'm in a bad situation. I was in a car accident and the police are holding me. I need $${a} for bail and legal fees. I'm so scared. Please send it to my friend's account. I'll explain everything later. Context: ${c}.\n\nLove, your grandson`
    }
};

// ========================================================================
// 3. GENERATE NARRATIVE
// ========================================================================
function generateNarrative() {
    const agentKey = document.getElementById('agentSelect').value;
    const templateKey = document.getElementById('templateSelect').value;
    const target = document.getElementById('targetName').value || 'Client';
    const amount = document.getElementById('targetAmount').value || '5,000';
    const context = document.getElementById('contextInput').value || 'standard procedure';
    const tone = document.getElementById('toneSelect').value;
    const depth = document.getElementById('depthSelect').value;

    const agent = agents[agentKey] || { role: 'Unknown', style: 'neutral', motto: '' };
    const template = templates[templateKey];
    if (!template) {
        document.getElementById('outputArea').innerHTML = '<span style="color:#ff7b7b;">// Template not found</span>';
        return;
    }

    // Choose the narrative based on depth
    let narrative = '';
    if (depth === 'basic') narrative = template.basic(target, amount, context);
    else if (depth === 'detailed') narrative = template.detailed(target, amount, context);
    else narrative = template.full(target, amount, context);

    // Apply tone modifications (add extra lines based on tone)
    const toneModifiers = {
        urgent: '\n\n⚠️ This is time-critical. Immediate action required.',
        friendly: '\n\nWe appreciate your cooperation and trust.',
        professional: '\n\nThis communication is official and confidential.',
        emotional: '\n\nPlease, I beg you, don\'t let me down.'
    };
    const toneAdd = toneModifiers[tone] || '';

    // Insert agent persona voice
    const agentVoice = `[Agent: ${agentKey} • Role: ${agent.role} • Style: ${agent.style}]`;

    // Build final narrative with metadata
    const header = `=== SCAM-APT v4.0 GENERATED NARRATIVE ===\nAgent: ${agentKey} (${agent.role})\nTemplate: ${templateKey}\nTone: ${tone} | Depth: ${depth}\nTarget: ${target} | Amount: $${amount}\nContext: ${context}\n${agentVoice}\n\n`;

    const fullNarrative = header + narrative + toneAdd;

    // Also generate AI prompt
    const prompt = `[AI PROMPT]\nYou are an advanced AI assistant specialized in generating realistic scam narratives for educational purposes. Using the persona of ${agentKey} (${agent.role}), create a ${depth} ${templateKey} scenario targeting ${target} with amount $${amount}. The context is "${context}". The tone should be ${tone}. Include urgency, authority, and a clear call to action. Ensure the script is convincing but clearly labeled as synthetic.`;

    // Store prompt for later display
    window._lastPrompt = prompt;
    window._lastNarrative = fullNarrative;

    // Output with highlighting
    let output = fullNarrative;
    // We'll highlight with regex in the display

    return { narrative: fullNarrative, prompt: prompt };
}

// ========================================================================
// 4. DISPLAY WITH HIGHLIGHTING
// ========================================================================
function displayOutput(narrative, prompt) {
    const outputArea = document.getElementById('outputArea');
    // Escape HTML entities (simple)
    const escape = (s) => s.replace(/[&<>"]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        return m;
    });
    let html = escape(narrative);
    // Simple highlighting
    html = html.replace(/\$\d+(,\d+)?/g, m => `<span class="highlight">${m}</span>`);
    html = html.replace(/\b(URGENT|ALERT|IMMEDIATE|WARNING|threat|must|now|emergency|critical|penalty|loss|arrest|danger)\b/gi, m => `<span class="threat">${m}</span>`);
    html = html.replace(/\b(transfer|send|pay|call|click|access|install|verify|authorize|deposit|wire|move|secure|claim)\b/gi, m => `<span class="action">${m}</span>`);
    html = html.replace(/\b(CEO|CFO|executive|director|recruiter|consultant|analyst|manager|officer|agent|lawyer|doctor)\b/gi, m => `<span class="persona">${m}</span>`);
    html = html.replace(/\b(returns|profit|funds|balance|payment|invoice|refund|salary|investment|USDT|BTC|wallet|asset|deposit)\b/gi, m => `<span class="finance">${m}</span>`);

    // Insert prompt if visible
    const showPrompt = document.getElementById('showPromptBtn').dataset.show === 'true';
    if (showPrompt) {
        html = `<span class="prompt">${escape(prompt)}</span>\n\n` + html;
    }

    outputArea.innerHTML = html;
}

// ========================================================================
// 5. AGENT TAGS (quick reference)
// ========================================================================
function renderAgentTags() {
    const container = document.getElementById('agentTags');
    const keys = Object.keys(agents);
    container.innerHTML = keys.map(k => {
        const a = agents[k];
        return `<span class="tag"><i class="fas fa-user"></i> ${k} (${a.role})</span>`;
    }).join('');
}

// ========================================================================
// 6. EVENT HANDLERS & INIT
// ========================================================================
document.addEventListener('DOMContentLoaded', function() {
    renderAgentTags();

    const generateBtn = document.getElementById('generateBtn');
    const showPromptBtn = document.getElementById('showPromptBtn');
    const outputArea = document.getElementById('outputArea');

    // Toggle prompt visibility
    let promptVisible = false;
    showPromptBtn.addEventListener('click', function() {
        promptVisible = !promptVisible;
        this.dataset.show = promptVisible ? 'true' : 'false';
        this.textContent = promptVisible ? 'Hide AI Prompt' : 'Show AI Prompt';
        // Regenerate with current settings
        generateAndDisplay();
    });

    function generateAndDisplay() {
        const result = generateNarrative();
        if (result) {
            displayOutput(result.narrative, result.prompt);
        }
    }

    generateBtn.addEventListener('click', generateAndDisplay);

    // Auto-generate on load
    generateAndDisplay();

    // Also regenerate on any input change (optional)
    ['agentSelect','templateSelect','targetName','targetAmount','contextInput','toneSelect','depthSelect'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('change', generateAndDisplay);
        if (el && el.tagName === 'INPUT') el.addEventListener('input', generateAndDisplay);
    });
});
</script>
